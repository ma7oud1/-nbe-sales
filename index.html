
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head> 
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#0D6B4A">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="NBE Tools">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NBE | Financial Tools</title>
<style>
:root{
 --green:#16A875;--green2:#25C98A;--navy:#16372B;
 --gold:#78D9AD;--bg:#f2f5f3;--card:#fff;
 --text:#1d3038;--muted:#718087;--border:#e0e8e3;
 --danger:#c0392b;--shadow:0 8px 25px rgba(20,50,40,.07);
}
body.dark{
 --bg:#080E0D;--card:#14231E;--text:#E8F5EE;
 --muted:#9CB8AA;--border:#29463B;--shadow:0 8px 25px rgba(0,0,0,.2);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:Tahoma,Arial,sans-serif;transition:.2s}
button,input,select{font:inherit}
button{cursor:pointer}
.container{max-width:1250px;margin:auto;padding:20px}
.header{
 background:linear-gradient(120deg,#071F18,#16A875,#0D4935);
 color:white;border-radius:18px;padding:25px;
 display:flex;align-items:center;justify-content:space-between;
 gap:20px;flex-wrap:wrap;box-shadow:var(--shadow)
}
.brand{display:flex;align-items:center;gap:15px}
.logo{width:70px;height:70px;background:white;border-radius:15px;display:flex;align-items:center;justify-content:center;overflow:hidden;padding:5px;flex-shrink:0}
.logo img{width:100%;height:100%;object-fit:contain}
.brand h1{font-size:23px;margin:0 0 7px}
.brand p{margin:0;color:#d5e9df;font-size:13px}
.header-actions{display:flex;gap:8px;flex-wrap:wrap}
.header-actions button{background:rgba(255,255,255,.13);color:white;border:1px solid rgba(255,255,255,.3);padding:10px 14px;border-radius:9px}
.section{background:var(--card);border:1px solid var(--border);border-radius:15px;padding:20px;margin-top:18px;box-shadow:var(--shadow)}
.section-title{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:17px;flex-wrap:wrap}
.section-title h2{font-size:17px;margin:0;color:var(--green)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}

/* بيانات التقرير: تثبيت البطاقة فعلياً في الركن العلوي الأيسر */
#pageHost .home-page > .info-section{
 display:block!important;
 float:left!important;
 clear:both!important;
 width:350px!important;
 max-width:100%!important;
 margin:0 auto 18px 0!important;
 direction:rtl;
}
#pageHost .home-page > .info-section .grid{
 display:grid!important;
 grid-template-columns:minmax(0,1fr)!important;
 gap:11px!important;
}
#pageHost .home-page > .info-section .section-title{
 justify-content:flex-start;
}
#pageHost .home-page > .info-section .section-title .badge{margin-right:auto}
#pageHost .home-page > .info-section .actions{
 display:flex!important;
 flex-direction:column!important;
}
#pageHost .home-page > .info-section .actions .btn{width:100%!important}
#pageHost .home-page > .stats{clear:both!important}
@media(max-width:800px){
 #pageHost .home-page > .info-section{
  float:none!important;
  width:100%!important;
  margin:0 0 18px!important;
 }
}

.field{display:flex;flex-direction:column;gap:7px}
.field label{font-size:13px;color:var(--muted);font-weight:bold}
input,select{width:100%;padding:12px;border:1px solid var(--border);background:var(--bg);color:var(--text);border-radius:9px;outline:none;min-width:0}
input:focus,select:focus{border-color:var(--green)}
input[readonly]{opacity:.85;border-style:dashed}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:13px;margin-top:18px}
.stat{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:18px;box-shadow:var(--shadow)}
.stat small{color:var(--muted);font-size:12px}
.stat strong{display:block;font-size:25px;margin-top:9px;color:var(--green)}
.stat.gold strong{color:var(--gold)}
.stat.navy strong{color:#54B8A0}
.stat.red strong{color:#d16b58}
.followup-stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:14px 0 20px}
.followup-stat{border:1px solid var(--border);background:var(--bg);border-radius:11px;padding:13px}
.followup-stat small{display:block;color:var(--muted);font-size:12px}
.followup-stat strong{display:block;color:var(--green);font-size:23px;margin-top:7px}
.followup-subtitle{font-size:14px;color:var(--green);margin:10px 0 14px}
.followup-list-title{margin-top:24px}
.follow-filter{max-width:180px}
.followup-table{min-width:950px}
.followup-table td{white-space:normal;max-width:190px}
.followup-table .btn{margin:2px}
.follow-status{display:inline-block;padding:5px 8px;border-radius:18px;background:#e4f4eb;color:#16A875;font-size:11px}
.follow-status.late{background:#fbe8e6;color:#b43d31}
.follow-status.done{background:#e8eef5;color:#345b78}
@media(max-width:520px){.followup-stats{grid-template-columns:1fr 1fr}.followup-stat:last-child{grid-column:1/-1}.follow-filter{max-width:100%}}
.target-controls{display:grid;grid-template-columns:repeat(4,minmax(0,1fr)) auto;gap:10px;align-items:end}
.target-save{height:43px;white-space:nowrap}
.performance-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:13px;margin-top:16px}
.target-box{border:1px solid var(--border);border-radius:12px;padding:16px;background:var(--bg)}
.target-label{font-size:13px;color:var(--muted);margin-bottom:8px}
.target-box strong{display:block;font-size:20px;color:var(--green);margin-bottom:12px}
.progress-track{height:10px;border-radius:20px;background:var(--border);overflow:hidden}
.progress-fill{height:100%;width:0;background:linear-gradient(90deg,#16A875,#78D9AD);border-radius:20px;transition:width .25s}
.target-box small{display:block;margin-top:8px;color:var(--muted)}
@media(max-width:800px){.target-controls{grid-template-columns:repeat(2,minmax(0,1fr))}.target-save{width:100%}.performance-grid{grid-template-columns:1fr 1fr}}
@media(max-width:520px){.target-controls,.performance-grid{grid-template-columns:1fr}.target-box strong{font-size:18px}}
.form-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:13px}
.btn{border:0;border-radius:9px;padding:11px 17px;font-weight:bold;transition:.2s}
.btn:hover{filter:brightness(1.08);transform:translateY(-1px)}
.primary{background:var(--green);color:white}
.secondary{background:var(--navy);color:white}
.gold-btn{background:var(--gold);color:#172b25}
.danger{background:var(--danger);color:white}
.light-btn{background:var(--bg);color:var(--text);border:1px solid var(--border)}
.small-btn{padding:7px 10px;font-size:12px}
.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:15px}
.tabs{display:flex;gap:8px;flex-wrap:wrap}
.tab{padding:10px 17px;border:1px solid var(--border);background:var(--bg);color:var(--text);border-radius:9px}
.tab.active{background:var(--green);color:white;border-color:var(--green)}
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:750px}
th,td{padding:12px 10px;text-align:right;border-bottom:1px solid var(--border);font-size:13px;white-space:nowrap}
th{background:var(--bg);color:var(--green);font-weight:bold}
tr:hover td{background:rgba(8,116,67,.035)}
.empty{text-align:center;color:var(--muted);padding:30px}
.badge{display:inline-block;padding:5px 9px;border-radius:20px;font-size:11px;background:#e4f4eb;color:#16A875}
.badge.pending{background:#fff3d9;color:#946a16}
.badge.rejected{background:#fbe8e6;color:#b43d31}
.archive-list{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.archive-item{border:1px solid var(--border);padding:13px;border-radius:10px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.archive-item strong{font-size:13px}
.note{font-size:12px;color:var(--muted);line-height:1.8;background:var(--bg);border-radius:9px;padding:12px;margin-top:15px}
.hidden{display:none!important}
.footer{text-align:center;color:var(--muted);font-size:11px;padding:25px 10px}
.print-heading{display:none}
.print-staff-banner{display:none}
@media print{
 .print-staff-banner{display:block!important;margin:0 0 16px;padding:12px 16px;border:1px solid #dce5df;border-top:4px solid #16A875;border-radius:8px;background:#fff!important;color:#18352b!important;break-inside:avoid}
 .print-staff-brand{text-align:center;padding-bottom:9px;border-bottom:1px solid #dce5df}
 .print-staff-brand strong{display:block;color:#16A875;font-size:18px}
 .print-staff-brand span{display:block;color:#64756c;font-size:9px;letter-spacing:1px;margin-top:3px}
 .print-staff-data{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:10px}
 .print-staff-data div{padding:7px 10px;background:#f4f8f5;border:1px solid #e2eae4;border-radius:5px}
 .print-staff-data small{display:block;color:#718087;font-size:10px;margin-bottom:4px}
 .print-staff-data strong{display:block;color:#18382c;font-size:13px}
 /* Staff identity remains visible on every printed report, including the sales ledger. */
}
@media(max-width:800px){
 .grid,.form-grid{grid-template-columns:repeat(2,1fr)}
 .stats{grid-template-columns:repeat(2,1fr)}
 .archive-list{grid-template-columns:1fr 1fr}
}
@media(max-width:520px){
 .container{padding:10px}.header{padding:17px}
 .brand h1{font-size:17px}.logo{width:55px;height:55px}
 .grid,.form-grid{grid-template-columns:1fr}
 .stats{gap:8px}.stat{padding:13px}
 .stat strong{font-size:21px}
 .section{padding:14px}
 .archive-list{grid-template-columns:1fr}
}

/* طباعة التقرير الكامل */
@media print{
 @page{size:A4 landscape;margin:12mm}
 body{background:white!important;color:#172b32!important;-webkit-print-color-adjust:exact!important;print-color-adjust:exact!important}
 .container{max-width:none;padding:0}
 .no-print,.header-actions,.entry-section,.archive-section,.note,.footer{display:none!important}
 .header{background:#16A875!important;color:white!important}
 .section,.stat{box-shadow:none}
}

/* طباعة سجل المبيعات الاحترافي فقط */
@media print{
 body.print-ledger .header,
 body.print-ledger .info-section,
 body.print-ledger .stats,
 body.print-ledger .entry-section,
 body.print-ledger .cards-section,
 body.print-ledger .loans-section,
 body.print-ledger .archive-section,
 body.print-ledger .footer,
 body.print-ledger .note{display:none!important}

 body.print-ledger .ledger-section{
  display:block!important;background:white!important;color:#172b32!important;
  border:none!important;box-shadow:none!important;padding:0!important;margin:0!important
 }
 body.print-ledger .ledger-section>.section-title,
 body.print-ledger .ledger-section>.tabs,
 body.print-ledger .delete-col{display:none!important}
 body.print-ledger .print-heading{display:block!important}
 body.print-ledger .ledger-section .table-wrap{overflow:visible!important}
 body.print-ledger .ledger-section table{width:100%!important;min-width:0!important;border-collapse:collapse!important}
 body.print-ledger .ledger-section th{
  background:#16A875!important;color:white!important;
  border:1px solid #16A875!important;padding:9px 5px!important;font-size:9px!important
 }
 body.print-ledger .ledger-section td{
  color:#172b32!important;border:1px solid #dce5df!important;
  padding:8px 5px!important;font-size:9px!important;white-space:normal!important
 }
 body.print-ledger .ledger-section tr:nth-child(even) td{background:#f1f7f3!important}
 body.print-ledger .ledger-section .badge{
  background:#edf5ef!important;color:#16A875!important;border:1px solid #ddd!important
 }
}

/* Portrait daily sales ledger: compact header and dense customer rows */
@media print{
 @page{size:A4 portrait;margin:5mm}
 body.print-ledger{font-family:Tahoma,Arial,sans-serif!important}
 body.print-ledger .container{padding:0!important}
 body.print-ledger .ledger-section{font-size:7px!important}
 body.print-ledger .ledger-section .print-heading{display:block!important;margin:0 0 5px!important}
 body.print-ledger .ledger-section .print-heading>div:first-child{
  padding-bottom:5px!important;border-bottom:2px solid #16A875!important;
  justify-content:center!important;gap:8px!important
 }
 body.print-ledger .ledger-section .print-heading>div:first-child>div:first-child{
  gap:7px!important
 }
 body.print-ledger .ledger-section .print-heading img{
  width:34px!important;height:30px!important
 }
 body.print-ledger .ledger-section .print-heading [style*="font-size:19px"]{font-size:13px!important}
 body.print-ledger .ledger-section .print-heading [style*="font-size:15px"]{font-size:10px!important}
 body.print-ledger .ledger-section .print-heading [style*="font-size:12px"]{font-size:8px!important}
 body.print-ledger .ledger-section .print-heading [style*="margin-top:16px"]{margin-top:5px!important}
 body.print-ledger .ledger-section .print-heading>div:nth-child(2){
  grid-template-columns:repeat(2,minmax(0,1fr))!important;gap:4px!important;margin-top:5px!important
 }
 body.print-ledger .ledger-section .print-heading>div:nth-child(2)>div{
  padding:4px 7px!important;border-radius:4px!important
 }
 body.print-ledger .ledger-section .print-heading>div:nth-child(2) small,
 body.print-ledger .ledger-section .print-heading>div:nth-child(2) div{font-size:8px!important}
 body.print-ledger .ledger-section .print-heading>div:nth-child(2) strong{font-size:10px!important}
 /* حذف شريط الملخص الأخير أسفل بيانات الهيدر */
 body.print-ledger .ledger-section .print-heading>div:nth-child(3){display:none!important}
 body.print-ledger .ledger-section .table-wrap{overflow:visible!important;margin-top:0!important}
 body.print-ledger .ledger-section table{
  width:100%!important;min-width:0!important;table-layout:fixed!important;
  border-collapse:collapse!important;page-break-inside:auto!important
 }
 body.print-ledger .ledger-section thead{display:table-header-group!important}
 body.print-ledger .ledger-section tr{break-inside:avoid!important;page-break-inside:avoid!important}
 body.print-ledger .ledger-section th{
  padding:3px 1px!important;font-size:6px!important;line-height:1.15!important;
  white-space:normal!important;overflow-wrap:anywhere!important
 }
 body.print-ledger .ledger-section td{
  padding:2px 1px!important;font-size:6px!important;line-height:1.15!important;
  white-space:normal!important;overflow-wrap:anywhere!important;word-break:break-word!important;
  vertical-align:middle!important
 }
 body.print-ledger .ledger-section th:nth-child(1),
 body.print-ledger .ledger-section td:nth-child(1){width:4%!important;text-align:center!important}
 body.print-ledger .ledger-section th:nth-child(2),
 body.print-ledger .ledger-section td:nth-child(2){width:9%!important}
 body.print-ledger .ledger-section th:nth-child(3),
 body.print-ledger .ledger-section td:nth-child(3){width:13%!important}
 body.print-ledger .ledger-section th:nth-child(4),
 body.print-ledger .ledger-section td:nth-child(4){width:12%!important}
 body.print-ledger .ledger-section th:nth-child(5),
 body.print-ledger .ledger-section td:nth-child(5){width:9%!important}
 body.print-ledger .ledger-section th:nth-child(6),
 body.print-ledger .ledger-section td:nth-child(6){width:10%!important}
 body.print-ledger .ledger-section th:nth-child(7),
 body.print-ledger .ledger-section td:nth-child(7){width:8%!important}
 body.print-ledger .ledger-section th:nth-child(8),
 body.print-ledger .ledger-section td:nth-child(8){width:13%!important}
 body.print-ledger .ledger-section th:nth-child(9),
 body.print-ledger .ledger-section td:nth-child(9){width:12%!important}
 body.print-ledger .ledger-section th:nth-child(10),
 body.print-ledger .ledger-section td:nth-child(10){width:10%!important}
}

/* عمليات السداد المتعددة في حاسبة الكارت */
.ci-payments{display:grid;gap:10px;margin:12px 0 18px}
.ci-payment-row{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) auto;gap:10px;align-items:end;padding:12px;border:1px solid var(--border-color,#ddd);border-radius:12px;background:var(--card-bg,transparent)}
.ci-payment-row .field{margin:0}
.ci-payment-row .field label{display:block;margin-bottom:6px}
.ci-payment-row input{width:100%;min-width:0}
.ci-remove{height:42px;white-space:nowrap}
.ci-payments-heading{margin-top:22px}
@media(max-width:520px){.ci-payment-row{grid-template-columns:1fr 1fr}.ci-remove{grid-column:1/-1;width:100%}}

/* حاسبة فوائد الكارت */
.calculator-section .calculator-results{grid-template-columns:repeat(4,minmax(0,1fr))}
.calculator-section .stat strong{font-size:clamp(17px,2.5vw,24px);overflow-wrap:anywhere}
#ciEquation{font-size:13px;line-height:2;direction:rtl;overflow-wrap:anywhere}
@media(max-width:800px){.calculator-section .calculator-results{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:520px){.calculator-section .calculator-results{grid-template-columns:1fr 1fr}.calculator-section .stat{padding:12px}}

/* Navigation is now handled by the slide-out sidebar. */
body{padding-bottom:24px}
.theme-toggle-btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:rgba(255,255,255,.14)!important;color:#fff!important;border:1px solid rgba(255,255,255,.28)!important;border-radius:12px;padding:10px 14px;font-weight:800}
.theme-toggle-btn span:first-child{font-size:18px;line-height:1}
@media(max-width:520px){.theme-toggle-btn{padding:9px 11px;font-size:12px}}
.app-page{display:none;animation:pageIn .18s ease}
.app-page.active{display:block}
.page-heading{padding:14px 4px 2px}
.page-heading h2{margin:0;color:var(--green);font-size:19px}
.page-heading p{margin:6px 0 0;color:var(--muted);font-size:12px}
.settings-panel{background:var(--card);border:1px solid var(--border);border-radius:15px;padding:20px;margin-top:18px;box-shadow:var(--shadow)}
.settings-panel h2{margin:0 0 9px;color:var(--green);font-size:17px}
.settings-panel p{margin:0;color:var(--muted);font-size:13px;line-height:1.9}
.settings-page .header-actions{margin-top:16px}
.settings-page .header-actions button{background:var(--green);color:#fff;border:0;padding:11px 14px;border-radius:9px}
@keyframes pageIn{from{opacity:.75;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}
@media(min-width:900px){
 #mainNav{left:50%;right:auto;transform:translateX(-50%);width:min(100%,850px);border:1px solid var(--border);border-bottom:0;border-radius:16px 16px 0 0}
 .nav-btn{font-size:12px;padding:9px}
}
@media(max-width:390px){.nav-btn{font-size:9px}.nav-btn .nav-icon{font-size:17px}}
@media print{
 body{padding-bottom:0!important}
 #mainNav{display:none!important}
 .app-page{display:block!important}
 .customers-page,.targets-page,.settings-page,.archive-page,.visits-page{display:none!important}
 body.print-ledger .app-page{display:none!important}
 body.print-ledger .sales-page{display:block!important}
}


#nbeSecurityOverlay{position:fixed;inset:0;z-index:99999;display:flex;align-items:center;justify-content:center;padding:18px;background:rgba(5,24,18,.94);font-family:Tahoma,Arial,sans-serif}#nbeSecurityOverlay[hidden]{display:none}.nbe-security-card{width:min(100%,420px);background:var(--card,#fff);color:var(--text,#1d3038);border:1px solid var(--border,#dce5df);border-radius:20px;padding:25px;box-shadow:0 20px 70px #0005;text-align:right}.nbe-security-logo{font-size:38px;text-align:center}.nbe-security-card h2{text-align:center;color:var(--green,#16A875);margin:12px 0}.nbe-security-card p{line-height:1.7;color:var(--muted,#718087);font-size:13px}.nbe-security-card label{display:block;margin:12px 0 6px;font-size:13px;font-weight:bold}.nbe-security-card input{width:100%;padding:12px;border:1px solid var(--border,#dce5df);border-radius:9px;background:var(--bg,#f2f5f3);color:var(--text,#1d3038)}.nbe-security-card form .btn{width:100%;margin-top:16px}.nbe-security-card small{display:block;margin-top:16px;line-height:1.7;color:var(--muted,#718087)}.nbe-bio-btn{width:100%;margin-top:10px}.nbe-security-card #nbeSecurityError{color:#c0392b;min-height:18px;margin:8px 0 0}body.nbe-locked{overflow:hidden}

/* اختصارات سريعة */
.nbe-dashboard{margin-top:18px;display:grid;gap:14px}
.dash-head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding:5px 2px}
.dash-head h2{margin:0;color:var(--green);font-size:19px}
.dash-head p{margin:6px 0 0;color:var(--muted);font-size:12px}
.dash-month{display:flex;align-items:center;gap:9px;min-width:210px}
.dash-month label{font-size:12px;color:var(--muted);white-space:nowrap;font-weight:bold}
.dash-month input{padding:9px}
.dash-kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.dash-kpi,.dash-panel{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:16px;box-shadow:var(--shadow);min-width:0}
.dash-kpi span,.dash-follow-grid span{display:block;color:var(--muted);font-size:12px}
.dash-kpi strong{display:block;color:var(--green);font-size:clamp(19px,2.5vw,27px);margin:10px 0 5px;overflow-wrap:anywhere}
.dash-kpi small{color:var(--muted);font-size:11px}
.dash-panel h3{margin:0 0 15px;font-size:15px;color:var(--green)}
.dash-columns{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.dash-statuses{display:grid;gap:12px}
.dash-status-row{display:grid;grid-template-columns:100px 1fr 32px;gap:8px;align-items:center;font-size:12px}
.dash-status-track{height:9px;background:var(--bg);border-radius:20px;overflow:hidden}
.dash-status-fill{height:100%;border-radius:20px;background:var(--green)}
.dash-status-row strong{text-align:left;font-size:12px}
.dash-follow-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.dash-follow-grid>div{background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:12px}
.dash-follow-grid strong{display:block;color:var(--green);font-size:22px;margin-top:7px}
.dash-bars{height:170px;display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px;align-items:end;border-bottom:1px solid var(--border);padding:8px 4px 0}
.dash-bar-group{height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:7px;min-width:0}
.dash-bar-pair{height:130px;width:100%;display:flex;align-items:flex-end;justify-content:center;gap:4px}
.dash-bar{width:min(24px,38%);min-height:2px;border-radius:5px 5px 0 0;background:var(--green);position:relative}
.dash-bar.loan{background:var(--gold)}
.dash-bar-group small{font-size:10px;color:var(--muted);white-space:nowrap}
.dash-legend{display:flex;gap:18px;margin-top:12px;font-size:11px;color:var(--muted)}
.dash-legend span:before{content:"";display:inline-block;width:9px;height:9px;border-radius:2px;background:var(--green);margin-left:6px}
.dash-legend span+span:before{background:var(--gold)}
.dash-recent-table{min-width:600px}
.dash-recent-table th,.dash-recent-table td{font-size:12px;padding:10px 8px}
@media(max-width:800px){.dash-kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.dash-columns{grid-template-columns:1fr}}
@media(max-width:420px){.dash-kpi{padding:12px}.dash-status-row{grid-template-columns:85px 1fr 25px}.dash-bars{gap:5px}.dash-bar-pair{gap:2px}.dash-month{width:100%}}



/* تنسيق لوحة إدارة التطبيق والبيانات */
.settings-data-card{margin-top:18px;padding:20px;border:1px solid var(--border);border-radius:16px;background:linear-gradient(145deg,var(--card),var(--bg));box-shadow:var(--shadow)}
.settings-data-heading{display:flex;align-items:center;justify-content:space-between;gap:14px}
.settings-eyebrow{display:block;color:var(--gold);font-size:10px;font-weight:900;letter-spacing:1.3px;margin-bottom:6px;direction:ltr;text-align:right}
.settings-data-heading h3{margin:0;color:var(--green);font-size:17px}
.settings-data-heading p{margin:7px 0 0;color:var(--muted);font-size:12px;line-height:1.8}
.settings-data-mark{width:46px;height:46px;flex:0 0 46px;display:grid;place-items:center;border-radius:13px;background:rgba(8,116,67,.1);color:var(--green);font-size:25px}
.settings-data-divider{height:1px;background:var(--border);margin:17px 0}
.settings-data-actions{display:grid!important;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px!important;margin:0!important}
.settings-data-actions button{min-height:46px;border:1px solid var(--border)!important;border-radius:11px!important;background:var(--card)!important;color:var(--text)!important;font-weight:800;padding:11px 12px!important;white-space:normal}
.settings-data-actions button:first-child{background:var(--green)!important;color:#fff!important;border-color:var(--green)!important}
.settings-data-actions button:nth-child(2){background:var(--bg)!important}
.settings-data-actions button.theme-toggle-btn{background:rgba(198,164,91,.15)!important;color:var(--text)!important;border-color:rgba(198,164,91,.45)!important}
.settings-data-actions #nbeBackupStatus{grid-column:1/-1;order:5;color:var(--muted)!important;background:var(--bg);border:1px solid var(--border);border-radius:9px;padding:9px 11px;text-align:center!important;flex-basis:auto!important}
.settings-data-actions input[type=file]{display:none!important}
@media(max-width:420px){.settings-data-card{padding:15px}.settings-data-actions{grid-template-columns:1fr}.settings-data-actions #nbeBackupStatus{grid-column:1}}


/* توحيد حقول التاريخ في كل صفحات التطبيق - iOS / Android */
input[type="date"]{
 display:block!important;box-sizing:border-box!important;
 width:100%!important;min-width:0!important;height:48px!important;min-height:48px!important;
 margin:0!important;padding:0 10px!important;
 border:1px solid var(--border)!important;border-radius:11px!important;

 color-scheme:light;direction:ltr;text-align:center;
 font-family:Tahoma,Arial,sans-serif!important;font-size:15px!important;
 font-weight:600;font-variant-numeric:tabular-nums;line-height:normal!important;
 vertical-align:middle;appearance:auto;-webkit-appearance:auto;
}
body.dark input[type="date"]{color-scheme:dark}
input[type="date"]:focus{border-color:var(--green)!important;box-shadow:0 0 0 3px rgba(8,116,67,.12);outline:none}
input[type="date"]::-webkit-date-and-time-value{min-height:1.4em;text-align:center;margin:0 auto}
input[type="date"]::-webkit-datetime-edit{padding:0 2px;line-height:normal}
input[type="date"]::-webkit-datetime-edit-fields-wrapper{padding:0;display:flex;justify-content:center;align-items:center}
input[type="date"]::-webkit-calendar-picker-indicator{
 width:18px;height:18px;flex:0 0 18px;padding:2px;margin:0 0 0 5px;
 border-radius:5px;cursor:pointer;opacity:.85
}
input[type="date"]::-webkit-calendar-picker-indicator:hover{background:rgba(8,116,67,.13);opacity:1}
#reportDate{direction:ltr;text-align:center;font-weight:700;letter-spacing:.025em}
.field input[type="date"]{align-self:stretch}
@media(max-width:520px){
 input[type="date"]{height:48px!important;min-height:48px!important;font-size:14px!important;padding:0 9px!important}

/* NBE Sales Premium UI Refresh */
:root{--green:#16A875;--green2:#0a8f5b;--navy:#123342;--gold:#c7a45d;--bg:#f3f6f5;--card:#ffffff;--text:#1b3038;--muted:#718187;--border:#e3ebe7;--shadow:0 12px 32px rgba(18,55,40,.075)}
body{background:radial-gradient(ellipse at 90% 0%,rgba(8,116,67,.07),transparent 34%),var(--bg);letter-spacing:0}
.container{max-width:1320px;padding:24px 22px 110px}
.header{position:relative;overflow:hidden;border-radius:24px;padding:27px 30px;background:linear-gradient(118deg,#082f25 0%,#16A875 58%,#0d6b4c 100%);box-shadow:0 18px 42px rgba(5,65,40,.18)}
.header:after{content:"";position:absolute;width:280px;height:280px;border:1px solid rgba(255,255,255,.12);border-radius:50%;left:-90px;top:-160px;box-shadow:0 0 0 28px rgba(255,255,255,.035),0 0 0 58px rgba(255,255,255,.025);pointer-events:none}
.brand,.header-actions{position:relative;z-index:1}
.logo{width:76px;height:76px;border-radius:19px;box-shadow:0 8px 22px rgba(0,0,0,.12)}
.brand h1{font-size:25px;letter-spacing:-.4px}
.brand p{letter-spacing:.35px}
.header-actions button{border-radius:12px;padding:11px 15px;backdrop-filter:blur(8px)}
.section,.stat,.dash-kpi,.dash-panel,.settings-panel{border-radius:19px;box-shadow:0 7px 24px rgba(20,50,40,.045);border-color:rgba(210,224,216,.85)}
.section{padding:22px;margin-top:20px}
.section-title h2,.page-heading h2{font-weight:800;letter-spacing:-.2px}
.section-title{margin-bottom:20px}
input,select{border-radius:12px;padding:13px 14px;transition:border-color .18s,box-shadow .18s,background .18s}
input:focus,select:focus{border-color:var(--green2);box-shadow:0 0 0 3px rgba(8,116,67,.10)}
.field label{font-size:12px;letter-spacing:.1px}
.btn{border-radius:12px;padding:12px 18px;box-shadow:0 3px 8px rgba(0,0,0,.045)}
.primary{background:linear-gradient(135deg,#16A875,#0a8d5a)}
.secondary{background:linear-gradient(135deg,#123342,#1b5064)}
.gold-btn{background:linear-gradient(135deg,#d6bb7d,#c5a45d)}
.light-btn{background:var(--card);border:1px solid var(--border)}
.stats{gap:15px}
.stat{padding:20px;position:relative;overflow:hidden}
.stat:after{content:"";position:absolute;left:-22px;bottom:-34px;width:90px;height:90px;border-radius:50%;background:rgba(8,116,67,.045)}
.stat strong{font-size:29px;letter-spacing:-.6px}
.stat small{font-weight:700}
.target-box,.followup-stat,.archive-item{border-radius:14px}
.progress-track{height:11px;background:#e8efeb}
.progress-fill{background:linear-gradient(90deg,#16A875,#13a66c)}
.table-wrap{border:1px solid var(--border);border-radius:14px}
table{border-collapse:separate;border-spacing:0}
th{background:#f0f5f2}
th:first-child{border-top-right-radius:10px}th:last-child{border-top-left-radius:10px}
tr:last-child td{border-bottom:0}
#mainNav{grid-template-columns:repeat(6,minmax(0,1fr));gap:7px;padding:9px max(12px,calc((100vw - 1050px)/2)) calc(9px + env(safe-area-inset-bottom));background:rgba(255,255,255,.94);backdrop-filter:blur(18px);border:1px solid rgba(218,230,223,.95);box-shadow:0 -8px 34px rgba(20,50,40,.10)}
.nav-btn{border-radius:13px;padding:8px 4px;font-size:11px;transition:background .18s,color .18s,transform .18s}
.nav-btn .nav-icon{font-size:20px}
.nav-btn.active{background:linear-gradient(135deg,rgba(8,116,67,.13),rgba(8,116,67,.07));color:#16A875}
.nav-btn:active{transform:scale(.97)}
.page-heading{padding:20px 5px 4px}
.page-heading h2{font-size:22px}
.page-heading p{font-size:13px}
.dash-kpi,.dash-panel{border-radius:17px;padding:19px}
.dash-kpi strong{letter-spacing:-.5px}
.dash-panel h3{font-weight:800}
.crm-section{padding:22px}
@media(min-width:900px){#mainNav{width:min(calc(100% - 40px),900px);border-radius:18px 18px 0 0}}
@media(max-width:800px){.container{padding:14px 14px 105px}.header{padding:21px;border-radius:20px}.brand h1{font-size:21px}.section{padding:17px}.stat{padding:16px}}
@media(max-width:520px){.container{padding:10px 10px 100px}.header{padding:17px;border-radius:18px;gap:15px}.brand{gap:11px}.brand h1{font-size:18px}.brand p{font-size:10px}.logo{width:58px;height:58px;border-radius:14px}.header-actions{width:100%}.header-actions button{flex:1;padding:10px 8px;font-size:12px}.section{padding:15px;border-radius:16px}.stats{gap:9px}.stat{padding:13px;border-radius:15px}.stat strong{font-size:23px}.nav-btn{font-size:9px;padding:7px 2px}.nav-btn .nav-icon{font-size:18px}.page-heading h2{font-size:19px}}
body.dark{--bg:#080E0D;--card:#14231E;--text:#edf5f0;--muted:#a5b5b8;--border:#29463B;--shadow:0 10px 28px rgba(0,0,0,.22)}

/* Premium loan calculator presentation */
.loan-calculator-section{
 position:relative;overflow:hidden;
 border:1px solid rgba(8,116,67,.16);
 background:linear-gradient(155deg,var(--card) 0%,color-mix(in srgb,var(--card) 94%,#16A875 6%) 100%);
 box-shadow:0 16px 42px rgba(14,54,39,.08);
}
.loan-calculator-section:before{
 content:"";position:absolute;inset:0 0 auto;height:5px;
 background:linear-gradient(90deg,#16A875,#78D9AD,#16A875);
}
.loan-calculator-section>.section-title:first-child{
 display:flex;align-items:center;justify-content:space-between;gap:12px;
 padding:4px 2px 17px;margin-bottom:18px;border-bottom:1px solid var(--border);
}
.loan-calculator-section>.section-title:first-child h2{
 font-size:23px;font-weight:900;letter-spacing:-.4px;
}
.loan-calculator-section>.section-title:first-child .badge{
 border-radius:999px;padding:7px 12px;font-size:10px;letter-spacing:1px;
 background:rgba(8,116,67,.10);color:#16A875;border:1px solid rgba(8,116,67,.18);
}
.loan-calculator-section>.actions:first-of-type{
 display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:6px;
 background:var(--bg);border:1px solid var(--border);border-radius:15px;
}
.loan-calculator-section>.actions:first-of-type .btn{

}

 border-radius:17px;background:var(--bg);

.loan-calculator-section .section-title:not(:first-child) h2{font-size:17px;font-weight:900}
.loan-calculator-section .section-title:not(:first-child) .badge{
 background:rgba(198,164,91,.13);color:#9b7838;border-radius:999px;padding:6px 10px;
}
.loan-calculator-section>.muted{margin:0 0 12px;line-height:1.8}
.loan-calculator-section .loan-extra-row{
 padding:15px;background:var(--bg);border:1px solid var(--border);
 border-radius:15px;box-shadow:0 5px 16px rgba(0,0,0,.035);

const NBE_TRANSLATION_KEYS=Object.keys(NBE_EN).sort((a,b)=>b.length-a.length);
function nbeTranslateValue(value){let out=String(value??"");for(const key of NBE_TRANSLATION_KEYS){if(key.length===1){if(out.trim()===key)out=NBE_EN[key];continue;}if(out.includes(key))out=out.split(key).join(NBE_EN[key]);}return out;}
const NBE_ORIGINAL_TEXT=new WeakMap();
function nbeTranslateTree(root){
 if(!root)return;
 const english=document.documentElement.lang==="en";
 const walker=document.createTreeWalker(root,NodeFilter.SHOW_TEXT),nodes=[];
 while(walker.nextNode())nodes.push(walker.currentNode);
 nodes.forEach(n=>{
  const p=n.parentElement;
  if(!p||p.closest("script,style,textarea,[contenteditable=true]")||/^(SCRIPT|STYLE|TEXTAREA|INPUT)$/i.test(p.tagName))return;
  if(!NBE_ORIGINAL_TEXT.has(n))NBE_ORIGINAL_TEXT.set(n,n.nodeValue);
  const original=NBE_ORIGINAL_TEXT.get(n),trim=original.trim();
  n.nodeValue=english?nbeTranslateValue(original):original;
 });
 const translatableAttrs=["placeholder","aria-label","title","alt"];
 root.querySelectorAll("[placeholder],[aria-label],[title],[alt],input[type=button],input[type=submit],input[type=reset]").forEach(el=>{
  translatableAttrs.forEach(k=>{const v=el.getAttribute(k);if(v!==null){const dataKey="data-nbe-original-"+k;if(english){if(!el.hasAttribute(dataKey))el.setAttribute(dataKey,v);el.setAttribute(k,nbeTranslateValue(el.getAttribute(dataKey)));}else if(el.hasAttribute(dataKey)){el.setAttribute(k,el.getAttribute(dataKey));el.removeAttribute(dataKey);}}});
  if(/^(button|submit|reset)$/i.test(el.type||"")){const v=el.getAttribute("value");if(v!==null){if(english){if(!el.hasAttribute("data-nbe-original-value"))el.setAttribute("data-nbe-original-value",v);el.setAttribute("value",nbeTranslateValue(v));}else if(el.hasAttribute("data-nbe-original-value")){el.setAttribute("value",el.getAttribute("data-nbe-original-value"));el.removeAttribute("data-nbe-original-value");}}}
 });
}
function nbeApplyLanguage(lang,save=true){
 lang=lang==="en"?"en":"ar";document.documentElement.lang=lang;document.documentElement.dir=lang==="en"?"ltr":"rtl";document.body.classList.toggle("lang-en",lang==="en");
 if(save)try{NBEStore.setItem(NBE_LANG_KEY,lang)}catch(e){}
 const p=document.getElementById("nbeLanguageSelect");if(p)p.value=lang;
 nbeTranslateTree(document.body);
}
function setNbeLanguage(lang){nbeApplyLanguage(lang,true);}
(function(){const nativeAlert=window.alert.bind(window),nativeConfirm=window.confirm.bind(window);window.alert=function(message){return nativeAlert(document.documentElement.lang==="en"?nbeTranslateValue(message):message);};window.confirm=function(message){return nativeConfirm(document.documentElement.lang==="en"?nbeTranslateValue(message):message);};})();

}
function closeSidebar(){
 const sidebar=document.getElementById("appSidebar");
 const backdrop=document.getElementById("sidebarBackdrop");
 const button=document.getElementById("menuToggle");
 if(sidebar){
  sidebar.classList.remove("open");

 document.body.classList.remove("sidebar-open");
 if(button)button.setAttribute("aria-expanded","false");
}

/* NBE local database: IndexedDB with one-time LocalStorage migration */
const NBE_DB_NAME="nbe_sales_portfolio_db";
const NBE_DB_VERSION=2;
const NBEStore=(()=>{
 const memory=new Map();let db=null,writeQueue=Promise.resolve(),snapshotTimer=null,persistentStorage=false;
 function txDone(tx){return new Promise((resolve,reject)=>{tx.oncomplete=()=>resolve();tx.onerror=()=>reject(tx.error||new Error("IndexedDB transaction failed"));tx.onabort=()=>reject(tx.error||new Error("IndexedDB transaction aborted"));});}
 function openDb(){return new Promise((resolve,reject)=>{if(!("indexedDB" in window))return reject(new Error("IndexedDB unavailable"));let settled=false;const finish=(fn,value)=>{if(settled)return;settled=true;clearTimeout(timer);fn(value);};const req=indexedDB.open(NBE_DB_NAME,NBE_DB_VERSION);const timer=setTimeout(()=>finish(reject,new Error("IndexedDB open timed out")),5000);req.onupgradeneeded=()=>{const d=req.result;if(!d.objectStoreNames.contains("kv"))d.createObjectStore("kv",{keyPath:"key"});if(!d.objectStoreNames.contains("snapshots"))d.createObjectStore("snapshots",{keyPath:"id"});if(!d.objectStoreNames.contains("scannerDocs"))d.createObjectStore("scannerDocs",{keyPath:"id"});};req.onsuccess=()=>{if(settled){try{req.result.close();}catch(_){}return;}req.result.onversionchange=()=>req.result.close();finish(resolve,req.result);};req.onerror=()=>finish(reject,req.error||new Error("Could not open local database"));req.onblocked=()=>finish(reject,new Error("IndexedDB open blocked by another tab"));});}
 function enqueue(task){writeQueue=writeQueue.then(task).catch(error=>{console.error("NBE local database write error:",error);window.dispatchEvent(new CustomEvent("nbe-storage-error"));});return writeQueue;}
 async function latestSnapshot(){if(!db)return null;const tx=db.transaction("snapshots","readonly");const rows=await new Promise((resolve,reject)=>{const req=tx.objectStore("snapshots").getAll();req.onsuccess=()=>resolve(req.result||[]);req.onerror=()=>reject(req.error);});rows.sort((a,b)=>b.id-a.id);return rows[0]||null;}
 function updateBackupStatus(timestamp){const el=document.getElementById("nbeBackupStatus");if(!el)return;if(!db){el.textContent="التخزين المحلي الاحتياطي يعمل • النسخ التلقائي غير متاح في هذا الوضع";return;}const date=timestamp?new Date(timestamp):null;el.textContent=date?"قاعدة البيانات المحلية تعمل • آخر نسخة تلقائية: "+date.toLocaleString("ar-EG"):"قاعدة البيانات المحلية تعمل • النسخ التلقائي يعمل";}
 async function saveSnapshot(){if(!db||!memory.size)return;await writeQueue;const snapshot={id:Date.now(),timestamp:new Date().toISOString(),entries:Object.fromEntries(memory)};const readTx=db.transaction("snapshots","readonly");const all=await new Promise((resolve,reject)=>{const req=readTx.objectStore("snapshots").getAll();req.onsuccess=()=>resolve(req.result||[]);req.onerror=()=>reject(req.error);});all.sort((a,b)=>b.id-a.id);const tx=db.transaction("snapshots","readwrite");const store=tx.objectStore("snapshots");store.put(snapshot);all.slice(14).forEach(item=>store.delete(item.id));await txDone(tx);updateBackupStatus(snapshot.timestamp);}
 function scheduleSnapshot(){if(snapshotTimer)clearTimeout(snapshotTimer);snapshotTimer=setTimeout(()=>{saveSnapshot().catch(error=>console.warn("Automatic snapshot skipped:",error));},1800);}
 async function init(){try{db=await openDb();const tx=db.transaction("kv","readonly");const rows=await new Promise((resolve,reject)=>{const req=tx.objectStore("kv").getAll();req.onsuccess=()=>resolve(req.result||[]);req.onerror=()=>reject(req.error);});rows.forEach(row=>memory.set(row.key,row.value));try{const legacy=window.localStorage;for(let i=0;i<legacy.length;i++){const key=legacy.key(i);if(key&&!memory.has(key)){const value=legacy.getItem(key);memory.set(key,value);await enqueue(()=>{const wtx=db.transaction("kv","readwrite");wtx.objectStore("kv").put({key,value});return txDone(wtx);});}}}catch(storageError){console.warn("NBE legacy storage unavailable:",storageError);}if(navigator.storage&&navigator.storage.persist){try{persistentStorage=await navigator.storage.persist();}catch(_){}}const latest=await latestSnapshot();updateBackupStatus(latest&&latest.timestamp);if(!latest&&memory.size)scheduleSnapshot();return{mode:"indexeddb",persistentStorage};}catch(error){console.warn("NBE database unavailable; starting with safe browser fallback:",error);db=null;try{const legacy=window.localStorage;for(let i=0;i<legacy.length;i++){const key=legacy.key(i);if(key&&!memory.has(key))memory.set(key,legacy.getItem(key));}}catch(storageError){console.warn("NBE browser storage unavailable; using temporary in-memory storage:",storageError);}updateBackupStatus(null);return{mode:"localstorage-fallback",persistentStorage:false};}}
 function getItem(key){return memory.has(String(key))?memory.get(String(key)):null;}
 function setItem(key,value){key=String(key);value=String(value);memory.set(key,value);if(db){enqueue(()=>{const tx=db.transaction("kv","readwrite");tx.objectStore("kv").put({key,value});return txDone(tx);});scheduleSnapshot();}else{try{window.localStorage.setItem(key,value);}catch(error){console.error("NBE fallback storage error:",error);}}}
 function removeItem(key){key=String(key);memory.delete(key);if(db){enqueue(()=>{const tx=db.transaction("kv","readwrite");tx.objectStore("kv").delete(key);return txDone(tx);});scheduleSnapshot();}else{try{window.localStorage.removeItem(key);}catch(_){}}}
 async function replaceAll(entries){if(!db||!entries||typeof entries!=="object")throw new Error("قاعدة البيانات المحلية غير متاحة");const tx=db.transaction("kv","readwrite");const store=tx.objectStore("kv");store.clear();memory.clear();Object.entries(entries).forEach(([key,value])=>{const text=String(value);memory.set(key,text);store.put({key,value:text});});await txDone(tx);}
 async function putScannerDoc(doc){if(!db)throw new Error("Local database is not available");const tx=db.transaction("scannerDocs","readwrite");tx.objectStore("scannerDocs").put(doc);await txDone(tx);return doc;}
 async function getScannerDocs(){if(!db)return[];const tx=db.transaction("scannerDocs","readonly");return await new Promise((resolve,reject)=>{const req=tx.objectStore("scannerDocs").getAll();req.onsuccess=()=>resolve((req.result||[]).sort((a,b)=>(b.savedAt||0)-(a.savedAt||0)));req.onerror=()=>reject(req.error);});}
 async function deleteScannerDoc(id){if(!db)throw new Error("Local database is not available");const tx=db.transaction("scannerDocs","readwrite");tx.objectStore("scannerDocs").delete(String(id));await txDone(tx);}
 return{getItem,setItem,removeItem,init,latestSnapshot,replaceAll,putScannerDoc,getScannerDocs,deleteScannerDoc,entries:()=>Object.fromEntries(memory),flush:()=>writeQueue,get mode(){return db?"indexeddb":"localstorage-fallback";},get persistentStorage(){return persistentStorage;}};
})();
window.NBEStore=NBEStore;
window.NBEStorageReady=NBEStore.init();
window.addEventListener("nbe-storage-error",()=>{const status=document.getElementById("nbeBackupStatus");if(status)status.textContent="تنبيه: تعذر حفظ آخر تغيير في قاعدة البيانات";});

function calculateCardInterest(){
 const balance=Number($("ciBalance").value);
 const monthDays=Number($("ciMonthDays").value);
 const rate=Number($("ciRate").value);
 if(!Number.isFinite(balance)||balance<0||!Number.isInteger(monthDays)||monthDays<=0||!Number.isFinite(rate)||rate<0){
  alert("راجع المديونية ونسبة الفائدة وعدد أيام الشهر.");return;
 }
 const rows=[...document.querySelectorAll("#ciPayments .ci-payment-row")];
 const payments=[];
 for(let i=0;i<rows.length;i++){
  const amount=Number(rows[i].querySelector(".ci-payment-amount").value);
  const day=Number(rows[i].querySelector(".ci-payment-day").value);
  if(!Number.isFinite(amount)||amount<=0||!Number.isInteger(day)||day<1||day>monthDays){
   alert("أكمل مبلغ ويوم كل عملية سداد، وتأكد أن يوم السداد بين 1 وعدد أيام الشهر.");return;
  }
  payments.push({amount,day,index:i+1});
 }
 payments.sort((a,b)=>a.day-b.day||a.index-b.index);
 const paid=payments.reduce((sum,p)=>sum+p.amount,0);
 if(paid>balance+0.000001){alert("إجمالي مبالغ السداد أكبر من المديونية الأصلية.");return;}
 let remaining=balance,previousDay=0,interest=0;
 const lines=[];
 payments.forEach((p)=>{
  const days=p.day-previousDay;
  const segmentInterest=remaining*(days/monthDays)*(rate/100);
  interest+=segmentInterest;
  lines.push("من يوم "+(previousDay+1)+" إلى يوم "+p.day+": "+days+" يوم × رصيد "+fmtCardMoney(remaining)+" × "+rate+"% ÷ "+monthDays+" = "+fmtCardMoney(segmentInterest)+" جنيه");
  remaining-=p.amount;
  previousDay=p.day;
  lines.push("سداد "+fmtCardMoney(p.amount)+" جنيه يوم "+p.day+" ← الرصيد "+fmtCardMoney(remaining)+" جنيه");
 });
 const lastDays=monthDays-previousDay;
 if(lastDays>0){
  const segmentInterest=remaining*(lastDays/monthDays)*(rate/100);
  interest+=segmentInterest;

function simulateLoan(principal,monthly,term,annualRate,extras,annualIncrease=0,firstInstallmentDate=null){
 const base=new Date();base.setHours(12,0,0,0);
 const firstDate=firstInstallmentDate?new Date(firstInstallmentDate+"T12:00:00"):loanAddMonths(base,1);
 const lastDate=loanAddMonths(firstDate,term-1);
 const events=[];
 for(let month=1;month<=term;month++){
  const installment=monthly*Math.pow(1+annualIncrease/100,Math.floor((month-1)/12));
  events.push({date:loanAddMonths(firstDate,month-1),type:"monthly",amount:installment,month,installment});
 }
 extras.forEach(extra=>{
  let date=new Date(extra.date);
  let guard=0;
  while(date<=lastDate&&guard++<term+2){
   if(date>base)events.push({date:new Date(date),type:"extra",amount:extra.amount});
   date=loanAddMonths(date,extra.interval);
  }
 });
 events.sort((a,b)=>a.date-b.date||(a.type==="monthly"?-1:1));
 let balance=principal,interest=0,totalPaid=0,previous=base,monthlyCount=0;
 const daily=extras.length>0,yearlyInstallments=[],schedule=[];
 for(const event of events){
  if(balance<=0.005)break;
  const openingBalance=balance;
  const days=Math.max(0,Math.round((event.date-previous)/86400000));
  const accrued=daily?balance*(annualRate/100)*days/360:balance*(annualRate/100)/12;
  balance+=accrued;interest+=accrued;previous=event.date;
  const paid=Math.min(balance,event.amount);
  balance-=paid;totalPaid+=paid;
  const principalPaid=Math.max(0,paid-accrued);
  if(event.type==="monthly"){
   monthlyCount++;
   const year=Math.floor((event.month-1)/12)+1;
   yearlyInstallments[year-1]={year,installment:event.installment,count:(yearlyInstallments[year-1]?.count||0)+1};
  }
  schedule.push({
   number:schedule.length+1,kind:event.type==="monthly"?"قسط شهري":"سداد إضافي",
   date:loanDateValue(event.date),monthlyNumber:event.type==="monthly"?monthlyCount:"",
   openingBalance,interest:accrued,payment:paid,principalPaid,closingBalance:balance
  });
 }
 return {paidOff:balance<=0.02,balance,interest,totalPaid,monthlyCount,yearlyInstallments,schedule};
}
function calculateLoan(){
 try{
  const years=Number($("loanYears").value),months=Number($("loanMonthsPart").value),term=years*12+months,rate=Number($("loanAnnualRate").value);
  const firstDateValue=$("loanFirstInstallmentDate").value;
  const firstDate=firstDateValue?new Date(firstDateValue+"T12:00:00"):null;
  const today=new Date();today.setHours(0,0,0,0);
  if(!firstDate||Number.isNaN(firstDate.getTime())||firstDate<today)throw new Error("حدد تاريخ أول قسط بتاريخ اليوم أو تاريخ لاحق.");
  const method=$("loanMethod")?.value||"fixed";
  const increase=method==="increasing"?Number($("loanAnnualIncrease").value):0;
  if(!Number.isInteger(years)||years<0||years>50||!Number.isInteger(months)||months<0||months>11||term<1||term>600||!Number.isFinite(rate)||rate<0||rate>100)throw new Error("أدخل مدة صحيحة بالسنين والشهور، بحد أقصى 50 سنة.");
  if(!Number.isFinite(increase)||increase<0||increase>100)throw new Error("أدخل نسبة زيادة سنوية صحيحة من 0 إلى 100%.");
  const extras=getLoanExtras(term);
  if(loanMode==="principal"){
   const monthly=Number($("loanMonthly").value);
   if(!Number.isFinite(monthly)||monthly<=0)throw new Error("أدخل قيمة القسط الشهري بشكل صحيح.");
   const scheduledBase=Array.from({length:term},(_,i)=>monthly*Math.pow(1+increase/100,Math.floor(i/12))).reduce((sum,x)=>sum+x,0);
   let low=0,high=scheduledBase+extras.reduce((sum,x)=>sum+x.amount*Math.ceil(term/x.interval),0);
   for(let i=0;i<90;i++){const mid=(low+high)/2;if(simulateLoan(mid,monthly,term,rate,extras,increase,firstDateValue).paidOff)low=mid;else high=mid;}
   if(low<=0.01)throw new Error("القسط غير كافٍ لسداد قرض بهذه المدة وسعر العائد.");
   const result=simulateLoan(low,monthly,term,rate,extras,increase,firstDateValue);
   showLoanResult(low,monthly,result,extras.length,method,increase);
  }else{
   const principal=Number($("loanPrincipal").value);
   if(!Number.isFinite(principal)||principal<=0)throw new Error("أدخل قيمة القرض بشكل صحيح.");
   let low=0,high=Math.max(principal*2,principal+1);
   while(!simulateLoan(principal,high,term,rate,extras,increase,firstDateValue).paidOff&&high<principal*100)high*=2;
   if(high>=principal*100&&!simulateLoan(principal,high,term,rate,extras,increase,firstDateValue).paidOff)throw new Error("تعذر إيجاد قسط مناسب؛ راجع البيانات.");
   for(let i=0;i<90;i++){const mid=(low+high)/2;if(simulateLoan(principal,mid,term,rate,extras,increase,firstDateValue).paidOff)high=mid;else low=mid;}
   const result=simulateLoan(principal,high,term,rate,extras,increase,firstDateValue);
   showLoanResult(principal,high,result,extras.length,method,increase);
  }
 }catch(e){alert(e.message||"تعذر إجراء الحساب.");}
}

  cv.cvtColor(src,gray,cv.COLOR_RGBA2GRAY);cv.GaussianBlur(gray,blur,new cv.Size(5,5),0);
  cv.Canny(blur,edges,45,135);kernel=cv.Mat.ones(3,3,cv.CV_8U);cv.dilate(edges,edges,kernel);
  cv.findContours(edges,contours,hierarchy,cv.RETR_LIST,cv.CHAIN_APPROX_SIMPLE);
  let bestArea=0,bestPoints=null;
  for(let i=0;i<contours.size();i++){
   const contour=contours.get(i),peri=cv.arcLength(contour,true),approx=new cv.Mat();
   cv.approxPolyDP(contour,approx,.02*peri,true);
   if(approx.rows===4&&cv.isContourConvex(approx)){
    const area=Math.abs(cv.contourArea(approx));
    if(area>bestArea&&area>work.width*work.height*.12){
     const pts=[];for(let j=0;j<4;j++)pts.push({x:approx.intAt(j,0),y:approx.intAt(j,1)});
     bestArea=area;bestPoints=csOrderCorners(pts);
    }
   }
   approx.delete();contour.delete();
  }
  if(!bestPoints)return null;
  const pts=bestPoints;
  const dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
  const width=Math.max(dist(pts[0],pts[1]),dist(pts[3],pts[2]));
  const height=Math.max(dist(pts[0],pts[3]),dist(pts[1],pts[2]));
  const ratio=width/Math.max(1,height);
  const outW=ratio>=1?1200:Math.max(600,Math.round(1200*ratio));
  const outH=ratio>=1?Math.max(600,Math.round(1200/ratio)):1200;
  const srcPts=cv.matFromArray(4,1,cv.CV_32FC2,[pts[0].x,pts[0].y,pts[1].x,pts[1].y,pts[2].x,pts[2].y,pts[3].x,pts[3].y]);
  const dstPts=cv.matFromArray(4,1,cv.CV_32FC2,[0,0,outW-1,0,outW-1,outH-1,0,outH-1]);
  const transform=cv.getPerspectiveTransform(srcPts,dstPts),warped=new cv.Mat();
  cv.warpPerspective(src,warped,transform,new cv.Size(outW,outH),cv.INTER_CUBIC,cv.BORDER_REPLICATE);
  const output=document.createElement("canvas");output.width=outW;output.height=outH;cv.imshow(output,warped);
  srcPts.delete();dstPts.delete();transform.delete();warped.delete();
  return output;
 }finally{
  [src,gray,blur,edges,contours,hierarchy,kernel].forEach(m=>{if(m){try{m.delete();}catch(_){}}});
  source.width=source.height=1;work.width=work.height=1;
 }
}
async function csAutoProcess(side){
 const item=cardScannerState[side];if(!item)return false;
 const status=csGet("csAutoStatus");if(status)status.textContent="Detecting document edges…";
 csSetLoadProgress(side,88,"Detecting document edges…",true);
 let canvas=null,detected=false;
 try{canvas=await csDetectAndWarp(item.image,cardScannerState.rotation);detected=!!canvas;}
 catch(e){console.warn("Automatic edge detection unavailable:",e);}
 if(!canvas){canvas=document.createElement("canvas");canvas.width=CS_OUT_W;canvas.height=CS_OUT_H;csCropDraw(item.image,canvas,cardScannerState.rotation);}
 const ctx=canvas.getContext("2d");if(ctx){if((csGet("csFilter")?.value||"auto")==="auto")csAutoLevels(canvas);}
 csSetLoadProgress(side,97,"Finishing scan…",true);
 const url=canvas.toDataURL("image/jpeg",.93),img=new Image();
 await new Promise((resolve,reject)=>{img.onload=resolve;img.onerror=reject;img.src=url;});
 cardScannerState[side]={image:img,source:url,processed:url,auto:true,edgeDetected:detected};
 const preview=csGet(side==="front"?"csFrontPreview":"csBackPreview");
 if(preview)preview.innerHTML='<img alt="Auto cropped '+side+' preview" src="'+url+'">';
 csSetLoadProgress(side,100,"Complete");
 if(status)status.textContent=detected?"✓ Document edges detected and perspective corrected.":"Could not find all four edges — showing the original framing. Try a clearer photo with the whole page visible.";
 return true;
}
function cardScannerAutoOnUpload(side){const status=csGet("csAutoStatus");if(status)status.textContent="Automatically enhancing "+side+" side…";csAutoProcess(side).then(ok=>{if(ok){cardScannerState[side].processed=cardScannerState[side].source;if(status)status.textContent=cardScannerState[side].edgeDetected?"✓ "+side+" side edges detected and cropped automatically.":"✓ "+side+" side loaded; edges were not clear enough for automatic crop."; }}).catch(e=>{if(status)status.textContent="Auto scan could not detect this side: "+e.message+" You can adjust it manually or try Auto Scan again.";});}
async function cardScannerAutoAll(){
 const btn=csGet("csAutoBtn");if(btn){btn.disabled=true;btn.textContent="Scanning…";}
 try{
  let done=0;
  for(const side of ["front","back"]){if(cardScannerState[side]){try{if(await csAutoProcess(side))done++;}catch(e){const status=csGet("csAutoStatus");if(status)status.textContent=e.message;alert((side==="front"?"Front":"Back")+": "+e.message);}}}
  if(done){["csZoom","csX","csY"].forEach((id,i)=>csGet(id).value=[1,0,0][i]);csGet("csBright").value=100;csGet("csContrast").value=100;csGet("csGray").checked=false;["front","back"].forEach(side=>{if(cardScannerState[side])cardScannerState[side].processed=cardScannerState[side].source;});const status=csGet("csAutoStatus");if(status)status.textContent="✓ Automatic scan complete. Review the cropped previews before saving.";}
 }catch(e){alert(e.message);const status=csGet("csAutoStatus");if(status)status.textContent=e.message;}
 finally{if(btn){btn.disabled=false;btn.textContent="✨ Auto Scan & Enhance";}}
}

function csCropDraw(img,canvas,rotation){const zoom=Number(csGet("csZoom")?.value||1),rot=document.createElement("canvas"),ctx=rot.getContext("2d"),swap=rotation%180!==0;rot.width=swap?img.naturalHeight:img.naturalWidth;rot.height=swap?img.naturalWidth:img.naturalHeight;ctx.translate(rot.width/2,rot.height/2);ctx.rotate(rotation*Math.PI/180);ctx.drawImage(img,-img.naturalWidth/2,-img.naturalHeight/2);const rw=rot.width,rh=rot.height,ra=rw/rh;let sw,sh;if(ra>CS_RATIO){sh=rh/zoom;sw=sh*CS_RATIO;}else{sw=rw/zoom;sh=sw/CS_RATIO;}const px=Number(csGet("csX")?.value||0)/100,py=Number(csGet("csY")?.value||0)/100,cx=Math.max(sw/2,Math.min(rw-sw/2,rw/2+px*(rw-sw)/2)),cy=Math.max(sh/2,Math.min(rh-sh/2,rh/2+py*(rh-sh)/2));const out=canvas.getContext("2d");out.clearRect(0,0,CS_OUT_W,CS_OUT_H);out.fillStyle="#fff";out.fillRect(0,0,CS_OUT_W,CS_OUT_H);const filter=csGet("csFilter")?.value||"auto";let css="brightness("+Number(csGet("csBright")?.value||108)+"%) contrast("+Number(csGet("csContrast")?.value||112)+"%)";if(filter==="gray"||csGet("csGray")?.checked)css+=" grayscale(1)";if(filter==="bw")css+=" grayscale(1) contrast(1.8)";if(filter==="magic")css+=" saturate(1.35) contrast(1.12)";out.filter=css;out.drawImage(rot,cx-sw/2,cy-sh/2,sw,sh,0,0,CS_OUT_W,CS_OUT_H);out.filter="none";if(filter==="auto"||filter==="magic")csAutoLevels(canvas);}
function cardScannerRenderSide(side){const item=cardScannerState[side];if(!item)return;const canvas=document.createElement("canvas");canvas.width=CS_OUT_W;canvas.height=CS_OUT_H;csCropDraw(item.image,canvas,cardScannerState.rotation);item.processed=canvas.toDataURL("image/jpeg",.94);const preview=csGet(side==="front"?"csFrontPreview":"csBackPreview");if(preview)preview.innerHTML='<img alt="'+(side==="front"?"Front":"Back")+' preview" src="'+item.processed+'">';}
function cardScannerRefresh(){["front","back"].forEach(cardScannerRenderSide);const z=csGet("csZoomOut"),b=csGet("csBrightOut"),c=csGet("csContrastOut");if(z)z.textContent=Number(csGet("csZoom").value).toFixed(1)+"×";if(b)b.textContent=csGet("csBright").value+"%";if(c)c.textContent=csGet("csContrast").value+"%";}
function cardScannerRotate(){cardScannerState.rotation=(cardScannerState.rotation+90)%360;cardScannerRefresh();}
function cardScannerResetAdjustments(){["csZoom","csBright","csContrast"].forEach((id,i)=>csGet(id).value=[1,108,112][i]);["csX","csY"].forEach(id=>csGet(id).value=0);csGet("csGray").checked=false;cardScannerState.rotation=0;cardScannerRefresh();}
function cardScannerClearCurrent(){cardScannerState.front=null;cardScannerState.back=null;cardScannerState.rotation=0;["csFrontFile","csBackFile"].forEach(id=>csGet(id).value="");["csFrontPreview","csBackPreview"].forEach((id,i)=>csGet(id).innerHTML='<span>No '+(i===0?"front":"back")+' image selected</span>');if(csGet("csName"))csGet("csName").value="";cardScannerResetAdjustments();}
async function cardScannerAdd(){
 if(!cardScannerState.front&&!cardScannerState.back){alert("Capture or upload at least one side first.");return;}
 const btn=document.querySelector(".scanner-actions button.btn.primary");if(btn){btn.disabled=true;btn.textContent="Saving…";}
 try{await window.NBEStorageReady;const doc={id:Date.now()+"-"+Math.random().toString(36).slice(2,7),name:(csGet("csName").value||"Document "+(cardScannerState.queue.length+1)).trim(),type:csGet("csType").value,front:cardScannerState.front?.processed||null,back:cardScannerState.back?.processed||null,savedAt:Date.now()};await NBEStore.putScannerDoc(doc);cardScannerState.queue.push({...doc});cardScannerRenderQueue();cardScannerClearCurrent();await cardScannerRenderSaved();const status=csGet("csAutoStatus");if(status)status.textContent="Document saved locally and added to the print queue.";}
 catch(error){console.error("Could not save scanner document:",error);alert("Could not save this document to the local database. Check available device storage and try again.");}
 finally{if(btn){btn.disabled=false;btn.textContent="＋ Add to print queue";}}
}
function cardScannerRenderQueue(){const host=csGet("csQueue"),count=cardScannerState.queue.length;csGet("csQueueCount").textContent=count+" document"+(count===1?"":"s");csGet("csPrintBtn").disabled=!count;csGet("csClearQueueBtn").disabled=!count;if(!count){host.className="scanner-queue-empty";host.textContent="Your print queue is empty. Add a front or back image to get started.";return;}host.className="scanner-queue-list";host.innerHTML=cardScannerState.queue.map(item=>'<article class="scanner-queue-item"><strong>'+csEscape(item.name)+' · '+csEscape(item.type)+'</strong><div class="scanner-queue-images"><div>'+(item.front?'<img src="'+item.front+'" alt="Front">':'<div class="scanner-preview">No front</div>')+'<small>Front</small></div><div>'+(item.back?'<img src="'+item.back+'" alt="Back">':'<div class="scanner-preview">No back</div>')+'<small>Back</small></div></div><button type="button" class="scanner-remove" onclick="cardScannerRemove(\''+item.id+'\')">Remove</button></article>').join("");}
function csEscape(v){return String(v).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function cardScannerRemove(id){cardScannerState.queue=cardScannerState.queue.filter(x=>x.id!==id);cardScannerRenderQueue();}
async function cardScannerRenderSaved(){const host=csGet("csSavedDocs");if(!host)return;try{await window.NBEStorageReady;const docs=await NBEStore.getScannerDocs();const count=csGet("csSavedCount");if(count)count.textContent=docs.length+" saved";if(!docs.length){host.className="scanner-queue-empty";host.textContent="No saved documents yet. Add a document to save it on this device.";return;}host.className="scanner-queue-list";host.innerHTML=docs.map(item=>'<article class="scanner-queue-item"><strong>'+csEscape(item.name)+' · '+csEscape(item.type)+'</strong><div class="scanner-queue-images"><div>'+(item.front?'<img src="'+item.front+'" alt="Front">':'<div class="scanner-preview">No front</div>')+'<small>Front</small></div><div>'+(item.back?'<img src="'+item.back+'" alt="Back">':'<div class="scanner-preview">No back</div>')+'<small>Back</small></div></div><div class="scanner-tools"><button type="button" class="btn light-btn" onclick="cardScannerQueueSaved(\''+item.id+'\')">Add to print queue</button><button type="button" class="scanner-remove" onclick="cardScannerDeleteSaved(\''+item.id+'\')">Delete</button></div><small class="scanner-hint">Saved '+new Date(item.savedAt||Date.now()).toLocaleDateString()+'</small></article>').join("");}catch(error){console.error("Could not load saved scanner documents:",error);host.className="scanner-queue-empty";host.textContent="Unable to load saved documents from the local database.";}}
async function cardScannerQueueSaved(id){const docs=await NBEStore.getScannerDocs();const doc=docs.find(x=>x.id===id);if(!doc)return;cardScannerState.queue.push({...doc});cardScannerRenderQueue();csGet("csQueue").scrollIntoView({behavior:"smooth",block:"center"});}
async function cardScannerDeleteSaved(id){if(!confirm("Delete this saved document from this device?"))return;try{await NBEStore.deleteScannerDoc(id);await cardScannerRenderSaved();}catch(error){console.error(error);alert("Could not delete this saved document.");}}
function cardScannerClearQueue(){if(!cardScannerState.queue.length)return;if(!confirm("Clear all documents from the print queue?"))return;cardScannerState.queue=[];cardScannerRenderQueue();}
function cardScannerPrint(){const list=cardScannerState.queue;if(!list.length)return;const mode=csGet("csPrintMode").value,win=window.open("","_blank");if(!win){alert("Allow pop-ups to print or save as PDF.");return;}const face=(src,label)=>src?'<div class="face"><img src="'+src+'" alt="'+label+'"><small>'+label+'</small></div>':'<div class="face empty-face"><div>No '+label.toLowerCase()+'</div><small>'+label+'</small></div>';let pages="";if(mode==="single")pages=list.map(item=>'<section class="sheet scanner-print-document"><h2>'+csEscape(item.name)+'</h2><div class="pair single-pair">'+face(item.front,"FRONT")+face(item.back,"BACK")+'</div></section>').join("");else{const chunks=[];for(let i=0;i<list.length;i+=4)chunks.push(list.slice(i,i+4));pages=chunks.map(chunk=>'<section class="sheet scanner-print-document"><div class="grid-sheet">'+chunk.map(item=>'<article class="grid-pair"><strong>'+csEscape(item.name)+'</strong>'+face(item.front,"FRONT")+face(item.back,"BACK")+'</article>').join("")+'</div></section>').join("");}const html='<!doctype html><html><head><meta charset="utf-8"><title>Card Scanner Print</title><style>@page{size:A4 portrait;margin:10mm}*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;color:#111}.sheet{width:190mm;min-height:277mm;position:relative;padding:4mm;break-after:page}.sheet:last-child{break-after:auto}.sheet h2{text-align:center;font-size:13px;margin:0 0 12mm}.single-pair{display:flex;gap:12mm;justify-content:center;align-items:flex-start;padding-top:18mm}.face{width:85.6mm;display:flex;flex-direction:column;align-items:center;gap:2mm}.face img{display:block;width:85.6mm;height:54mm;object-fit:fill;border:.2mm solid #bbb}.face small{font-size:8px;letter-spacing:1px}.empty-face{height:54mm;justify-content:center;border:.2mm dashed #bbb;color:#777}.empty-face div{font-size:10px}.grid-sheet{display:grid;grid-template-columns:85.6mm 85.6mm;grid-template-rows:repeat(2,auto);justify-content:space-between;align-content:start;g let csInitialized=false;
function cardScannerInit(){
 if(csInitialized||!csGet("csQueue"))return;
 csInitialized=true;
 [["csFrontFile","front"],["csFrontCamera","front"],["csBackFile","back"],["csBackCamera","back"]].forEach(([id,side])=>{const el=csGet(id);if(el)el.addEventListener("change",e=>csLoadSide(side,e.target.files&&e.target.files[0]));});
 ["csZoom","csX","csY","csBright","csContrast","csGray","csFilter"].forEach(id=>{const el=csGet(id);if(el)el.addEventListener("input",cardScannerRefresh);});
 cardScannerRenderQueue();
 window.NBEStorageReady.then(cardScannerRenderSaved).catch(error=>console.warn("Scanner database is not ready:",error));
}
const csObserver=new MutationObserver(()=>{if(csGet("csQueue")){cardScannerInit();csObserver.disconnect();}
});
