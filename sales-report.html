<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#12345a"><title>SALES REPORT</title>
<style>
:root{--navy:#12345a;--blue:#1d5687;--gold:#c8a45d;--bg:#f2f5f9;--ink:#172536;--muted:#68788a;--line:#dce4ed;--white:#fff}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Tahoma,Arial,sans-serif}
header{background:linear-gradient(120deg,#102b4b,#1d5687);color:#fff;padding:22px 16px;text-align:center;border-bottom:4px solid var(--gold)}
header h1{margin:0;font-size:23px;letter-spacing:.5px}header p{margin:7px 0 0;color:#dce8f4;font-size:12px}
main{max-width:1200px;margin:20px auto;padding:0 14px}.panel{background:#fff;border:1px solid var(--line);border-radius:14px;padding:17px;margin-bottom:15px;box-shadow:0 5px 18px #1836530b}
.panel h2{font-size:16px;color:var(--navy);margin:0 0 14px;padding-bottom:10px;border-bottom:1px solid var(--line)}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.field{display:flex;flex-direction:column;gap:6px}.field label{font-size:12px;color:var(--muted);font-weight:bold}.field input,.field select{width:100%;border:1px solid #ccd7e2;border-radius:8px;padding:10px;font:14px Tahoma;background:#fff;color:var(--ink);min-width:0}
.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.stat{background:#f4f8fc;border:1px solid #e1eaf3;border-radius:11px;padding:13px;text-align:center}.stat span{display:block;color:var(--muted);font-size:12px}.stat strong{display:block;color:var(--navy);font-size:21px;margin-top:7px}
.toolbar{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:14px}.btn{border:0;border-radius:9px;padding:10px 15px;font: bold 13px Tahoma;cursor:pointer}.primary{background:var(--navy);color:white}.secondary{background:#e7eef6;color:var(--navy)}.danger{background:#fff0ef;color:#a8322b}.gold{background:var(--gold);color:#172536}
.table-wrap{overflow-x:auto}table{border-collapse:collapse;width:100%;min-width:1050px;font-size:12px}th{background:var(--navy);color:#fff;padding:11px 7px;white-space:nowrap}td{border-bottom:1px solid var(--line);padding:8px 6px;text-align:center}tbody tr:nth-child(even){background:#f7f9fc}td input,td select{width:100%;min-width:75px;border:1px solid #d5dee8;border-radius:5px;padding:7px 5px;font:12px Tahoma}
td input[data-k="branchCode"]{min-width:82px}td input[data-k="branchName"]{min-width:115px}td input[data-k="employeeId"]{min-width:100px}td input[data-k="employeeName"]{min-width:165px}td input[readonly]{background:#eef3f8;color:#12345a;font-weight:bold;text-align:center}td .rowbtn{border:0;background:#fff0ef;color:#a8322b;border-radius:6px;padding:6px 8px;cursor:pointer}
.empty{text-align:center;color:var(--muted);padding:25px!important}
.note{color:var(--muted);font-size:11px;margin:10px 0 0}
@media(max-width:760px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.summary{grid-template-columns:repeat(2,1fr)}header h1{font-size:20px}}
@media print{
 @page{size:A4 landscape;margin:5mm}
 *{-webkit-print-color-adjust:exact!important;print-color-adjust:exact!important}
 body{background:#fff!important;font-size:9px}
 header{background:#fff!important;color:#12345a!important;border-bottom:2px solid #c8a45d;padding:8px}
 header p{color:#526477}
 .no-print,.toolbar,.note,.row-actions{display:none!important}
 main{max-width:none;margin:0;padding:0}
 .panel{box-shadow:none;border:1px solid #bbb;border-radius:0;padding:8px;margin:6px 0;break-inside:avoid}
 .panel h2{font-size:11px;margin-bottom:6px;padding-bottom:5px}
 .grid{gap:5px}.field label{font-size:8px}
 .field input,.field select{border:0;padding:2px;font-size:9px}
 .summary{gap:5px}.stat{padding:5px;border:1px solid #bbb}
 .stat span{font-size:8px}.stat strong{font-size:13px;margin-top:2px}
 .table-wrap{overflow:visible;border:0;border-radius:0}
 table{width:100%;min-width:0;table-layout:fixed;border-collapse:collapse;font-size:7.2px}
 thead{display:table-header-group}
 tr{break-inside:avoid;page-break-inside:avoid}
 th{padding:5px 3px;white-space:normal;overflow-wrap:anywhere;font-size:7.2px}
 td{padding:4px 3px;white-space:normal;overflow:visible;overflow-wrap:anywhere;vertical-align:middle;line-height:1.35}
 td span.print-value{display:block!important;width:100%;max-width:100%;white-space:normal!important;overflow:visible!important;text-overflow:clip!important;overflow-wrap:anywhere!important;word-break:break-word!important;line-height:1.35}
 td input,td select{display:none!important}
 th:nth-child(1),td:nth-child(1){width:3%}
 th:nth-child(2),td:nth-child(2){width:14%}
 th:nth-child(3),td:nth-child(3){width:11%}
 th:nth-child(4),td:nth-child(4){width:9%}
 th:nth-child(5),td:nth-child(5){width:13%}
 th:nth-child(6),td:nth-child(6){width:8%}
 th:nth-child(7),td:nth-child(7){width:8%}
 th:nth-child(8),td:nth-child(8){width:6%}
 th:nth-child(9),td:nth-child(9){width:7%}
 th:nth-child(10),td:nth-child(10){width:10%}
 th:nth-child(11),td:nth-child(11){width:11%}
 td .rowbtn{display:none!important}
}

/* Premium banking interface refresh */
:root{--navy:#102b4b;--blue:#245b88;--gold:#c7a15a;--bg:#eef2f7;--ink:#17283b;--muted:#718096;--line:#d9e2ec}
@media screen{
 body{background:linear-gradient(145deg,#f4f7fb 0%,#edf2f7 55%,#e8eef5 100%);min-height:100vh}
 header{position:relative;overflow:hidden;padding:30px 18px 27px;background:linear-gradient(115deg,#0b2038 0%,#123b63 58%,#245b88 100%);border-bottom:4px solid var(--gold);box-shadow:0 8px 24px #102b4b20}
 header:before{content:"";position:absolute;width:250px;height:250px;border:1px solid #ffffff18;border-radius:50%;left:-65px;top:-155px;box-shadow:0 0 0 24px #ffffff08,0 0 0 48px #ffffff06}
 header:after{content:"RETAIL BANKING  •  SALES";display:block;margin:13px auto 0;color:#e3c98f;font-size:9px;letter-spacing:2.5px;font-weight:bold}
 header h1{font-size:25px;font-weight:800;letter-spacing:.2px;text-shadow:0 2px 8px #0002}
 header p{font-size:13px;color:#d5e2ef}
 main{max-width:1280px;margin:25px auto;padding:0 18px 35px}
 .panel{position:relative;border:1px solid #e0e7ef;border-radius:16px;padding:20px;margin-bottom:17px;box-shadow:0 7px 24px #1836530c;background:#fff}
 .panel h2{display:flex;align-items:center;gap:10px;font-size:16px;font-weight:800;color:#153b60;border-bottom:1px solid #e9eef4;padding-bottom:13px;margin-bottom:17px}
 .panel h2:before{content:"";display:inline-block;width:4px;height:19px;border-radius:5px;background:linear-gradient(180deg,#d8b976,#ad8745)}
 .field{gap:8px}
 .field label{font-size:12px;color:#586b80}
 .field input,.field select{border:1px solid #d6e0ea;border-radius:9px;background:#fbfcfe;padding:11px 12px;transition:border-color .18s,box-shadow .18s,background .18s}
 .field input:focus,.field select:focus,td input:focus,td select:focus{outline:none;border-color:#477eaa;box-shadow:0 0 0 3px #245b8817;background:#fff}
 .field input[readonly]{background:#f0f4f8;color:#183d61;font-weight:700}
 .summary{gap:12px}
 .stat{position:relative;overflow:hidden;background:linear-gradient(145deg,#fff,#f5f8fc);border:1px solid #e1e9f1;border-radius:13px;padding:17px 12px;box-shadow:0 3px 10px #18365308}
 .stat:before{content:"";position:absolute;inset:0 0 auto;height:3px;background:linear-gradient(90deg,#c7a15a,#e5d2a8)}
 .stat span{font-size:12px;font-weight:700;color:#6a7c90}
 .stat strong{font-size:24px;color:#143c62;font-weight:800;font-variant-numeric:tabular-nums}
 .toolbar{align-items:center;gap:10px;margin-bottom:16px}
 .btn{padding:11px 17px;border-radius:9px;transition:transform .16s,box-shadow .16s,filter .16s}
 .btn:hover{transform:translateY(-1px);filter:brightness(1.04);box-shadow:0 5px 13px #102b4b18}
 .primary{background:linear-gradient(135deg,#12345a,#245b88)}
 .gold{background:linear-gradient(135deg,#d6b875,#bd984f);color:#172536}
 .secondary{background:#edf3f8;color:#234b70;border:1px solid #dce6ef}
 .danger{background:#fff1f0;border:1px solid #f4d8d5}
 .table-wrap{border:1px solid #e0e7ef;border-radius:11px;overflow:auto}
 table{min-width:1080px;font-size:12px}
 th{background:linear-gradient(100deg,#102b4b,#1c4c76);padding:13px 8px;font-size:11px;font-weight:700}
 td{padding:9px 7px;border-bottom:1px solid #e9eef3}
 tbody tr{transition:background .15s}
 tbody tr:hover{background:#edf4fa}
 tbody tr:nth-child(even){background:#f8fafc}
 tbody tr:nth-child(even):hover{background:#edf4fa}
 td input,td select{border:1px solid #dce4ec;border-radius:7px;background:#fff;padding:8px 6px;min-height:33px}
 td input[readonly]{background:#eef3f8;border-color:#e1e8ef}
 td .rowbtn{border:1px solid #f3d9d6;padding:7px 10px}
 .empty{font-size:13px!important;padding:34px!important}
 .note{line-height:1.7}
}
@media screen and (max-width:760px){
 header{padding:25px 14px 22px}
 header h1{font-size:20px}
 main{padding:0 10px 24px;margin:15px auto}
 .panel{padding:15px 12px;border-radius:13px}
 .panel h2{font-size:14px}
 .grid{gap:10px}
 .field input,.field select{font-size:13px;padding:10px 9px}
 .summary{gap:8px}
 .stat{padding:14px 8px}
 .stat strong{font-size:21px}
 .toolbar{display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}
 .toolbar .btn{width:100%;padding:11px 8px;font-size:12px}
 .table-wrap{border-radius:9px}
}

</style></head>
<body>
<header><h1>SALES REPORT | تقرير المبيعات</h1><p>نموذج تسجيل ومتابعة الكروت والقروض</p></header>
<main>
<section class="panel">
<h2>بيانات التقرير</h2>
<div class="grid">
<div class="field"><label>اسم السيلز</label><input id="salesName" value="محمود محمد رزق" readonly></div>
<div class="field"><label>تاريخ التقرير</label><input id="reportDate" type="date"></div>
<div class="field"><label>الرقم الوظيفي للسيلز</label><input id="salesId" value="479511" readonly></div>
<div class="field"><label>عدد الكروت</label><input id="cardCount" type="text" inputmode="numeric" data-numeric="integer" autocomplete="off" value="0"></div>
</div></section>
<section class="panel">
<h2>ملخص المبيعات</h2>
<div class="summary">
<div class="stat"><span>عدد الكروت</span><strong id="sCards">0</strong></div>
<div class="stat"><span>عدد القروض</span><strong id="sLoans">0</strong></div>
<div class="stat"><span>صافي قيمة القروض</span><strong id="sNet">0</strong></div>
<div class="stat"><span>إجمالي العملاء</span><strong id="sClients">0</strong></div>
</div></section>
<section class="panel">
<h2>بيانات العملاء والقروض</h2>
<div class="toolbar no-print">
<button class="btn primary" id="addBtn">＋ إضافة عميل</button>
<button class="btn gold" id="printBtn">طباعة التقرير</button>
<button class="btn secondary" id="saveBtn">حفظ البيانات</button>
<button class="btn secondary" id="exportBtn">تصدير CSV</button>
<button class="btn danger" id="clearBtn">مسح كل البيانات</button>
</div>
<div class="table-wrap"><table>
<thead><tr><th>م</th><th>اسم العميل</th><th>الرقم القومي</th><th>رقم الموبايل</th><th>جهة العمل</th><th>نوع القرض</th><th>قيمة القرض</th><th>كود الفرع</th><th>اسم الفرع</th><th>مصدر الطلب</th><th>صافي القرض</th><th class="no-print">حذف</th></tr></thead>
<tbody id="clients"></tbody></table></div>

</section>
</main>
<script>
const $=id=>document.getElementById(id);
const fields=[["name","اسم العميل","text"],["national","الرقم القومي","text"],["mobile","رقم الموبايل","tel"],["employer","جهة العمل","text"],["loanType","نوع القرض","select"],["amount","قيمة القرض","number"],["branchCode","كود الفرع","text"],["branchName","اسم الفرع","text"],["source","مصدر الطلب","text"],["net","صافي القرض","number"]];
let clients=[];
const fixedClientData={branchCode:"394",branchName:"رشيد",employeeId:"479511",employeeName:"محمود محمد رزق"};
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function normalizeNumeric(value,mode="integer"){
 const map={"٠":"0","١":"1","٢":"2","٣":"3","٤":"4","٥":"5","٦":"6","٧":"7","٨":"8","٩":"9","۰":"0","۱":"1","۲":"2","۳":"3","۴":"4","۵":"5","۶":"6","۷":"7","۸":"8","۹":"9"};
 let out=String(value??"").replace(/[٠-٩۰-۹]/g,d=>map[d]).replace(/[^0-9.]/g,"");
 if(mode!=="decimal")return out.replace(/\./g,"");
 const dot=out.indexOf(".");if(dot>=0)out=out.slice(0,dot+1)+out.slice(dot+1).replace(/\./g,"");
 return out;
}
function render(){
 const body=$("clients");body.innerHTML="";
 if(!clients.length){body.innerHTML='<tr><td class="empty" colspan="12">لا توجد بيانات عملاء حتى الآن</td></tr>'}
 clients.forEach((item,i)=>{
  const tr=document.createElement("tr");
  tr.innerHTML='<td>'+(i+1)+'</td>'+fields.map(([key,label,type])=>{
   if(type==="select")return '<td><select data-i="'+i+'" data-k="'+key+'"><option value="">اختر</option>'+["شخصي","سيارة","سلع معمرة","أخرى"].map(v=>'<option '+(item[key]===v?"selected":"")+'>'+v+'</option>').join("")+'</select></td>';
   const numeric=["national","mobile","amount","branchCode","net"].includes(key);
   const decimal=["amount","net"].includes(key);
   return '<td><input data-i="'+i+'" data-k="'+key+'" type="'+(numeric?"text":type)+'" '+(numeric?'inputmode="'+(decimal?"decimal":"numeric")+'" data-numeric="'+(decimal?"decimal":"integer")+'" autocomplete="off"':'')+' value="'+esc(fixedClientData[key]??item[key]??"")+'" '+(fixedClientData[key]!==undefined?"readonly":"")+' aria-label="'+label+'"></td>';
  }).join("")+'<td class="no-print row-actions"><button class="rowbtn" data-del="'+i+'">حذف</button></td>';
  body.appendChild(tr);
 });
 body.querySelectorAll('input[data-numeric]').forEach(el=>el.addEventListener("input",()=>{el.value=normalizeNumeric(el.value,el.dataset.numeric)}));
 body.querySelectorAll("input,select").forEach(el=>el.addEventListener("change",e=>{const i=+e.target.dataset.i,k=e.target.dataset.k;if(Number.isInteger(i)&&clients[i])clients[i][k]=e.target.value;updateSummary();persist()}));
 body.querySelectorAll("[data-del]").forEach(el=>el.addEventListener("click",()=>{clients.splice(+el.dataset.del,1);render();persist()}));
 updateSummary();
}
function addClient(){clients.push({...fixedClientData});render();persist()}
function updateSummary(){
 $("sCards").textContent=Number($("cardCount").value||0).toLocaleString("en-US");
 $("sLoans").textContent=clients.filter(x=>x.loanType).length.toLocaleString("en-US");
 $("sNet").textContent=clients.reduce((a,x)=>a+(Number(x.net)||0),0).toLocaleString("en-US",{maximumFractionDigits:2});
 $("sClients").textContent=clients.filter(x=>String(x.name||"").trim()).length.toLocaleString("en-US");
}
function snapshot(){clients=clients.map(x=>({...x,...fixedClientData}));return {salesName:"محمود محمد رزق",reportDate:$("reportDate").value,salesId:"479511",cardCount:$("cardCount").value,clients}}
function persist(){try{localStorage.setItem("salesReportStandalone",JSON.stringify(snapshot()))}catch(e){}}
function load(){try{const d=JSON.parse(localStorage.getItem("salesReportStandalone")||"null");if(d){$("salesName").value="محمود محمد رزق";$("reportDate").value=d.reportDate||new Date().toISOString().slice(0,10);$("salesId").value="479511";$("cardCount").value=d.cardCount||0;clients=Array.isArray(d.clients)?d.clients.map(x=>({...x,...fixedClientData})):[]}}catch(e){}}
function csv(){
 const headers=["م","اسم العميل","الرقم القومي","رقم الموبايل","جهة العمل","نوع القرض","قيمة القرض","كود الفرع","اسم الفرع","مصدر الطلب","صافي القرض"];
 const keys=["name","national","mobile","employer","loanType","amount","branchCode","branchName","source","net"];
 const rows=[["بيانات التقرير", $("salesName").value,$("reportDate").value],headers,...clients.map((x,i)=>[i+1,...keys.map(k=>x[k]||"")])];
 const data="\uFEFF"+rows.map(r=>r.map(v=>'"'+String(v??"").replace(/"/g,'""')+'"').join(",")).join("\r\n");
 const a=document.createElement("a"),url=URL.createObjectURL(new Blob([data],{type:"text/csv;charset=utf-8"}));a.href=url;a.download="sales-report.csv";a.click();URL.revokeObjectURL(url);
}
$("addBtn").onclick=addClient;$("printBtn").onclick=()=>window.print();$("saveBtn").onclick=()=>{persist();alert("تم حفظ البيانات على هذا الجهاز")};$("exportBtn").onclick=csv;
$("clearBtn").onclick=()=>{if(confirm("هل تريد مسح كل بيانات التقرير والعملاء؟")){clients=[];$("salesName").value="محمود محمد رزق";$("salesId").value="479511";$("cardCount").value=0;render();persist()}};
$("cardCount").addEventListener("input",()=>{$("cardCount").value=normalizeNumeric($("cardCount").value,"integer");updateSummary();persist()});
 ["salesName","reportDate","salesId","cardCount"].forEach(id=>$(id).addEventListener("change",()=>{updateSummary();persist()}));
window.addEventListener("beforeprint",()=>{document.querySelectorAll("#clients input, #clients select").forEach(el=>{const span=document.createElement("span");span.className="print-value";span.textContent=el.value||"—";el.replaceWith(span)})});
window.addEventListener("afterprint",()=>render());
load();if(!$("reportDate").value)$("reportDate").value=new Date().toISOString().slice(0,10);render();persist();
</script></body></html>
